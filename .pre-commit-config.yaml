# pre-commit 使用本地 uv 环境运行检查，不依赖 GitHub 仓库下载钩子，
# 因此无论代码托管在 GitHub、Gitee、GitLab 还是内网私有仓库，都能正常工作。
#
# 安装：uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        always_run: true
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        always_run: true
        pass_filenames: false

      - id: mypy
        name: mypy type check
        entry: uv run mypy src
        language: system
        types: [python]
        always_run: true
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [manual]
